<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>마실 — 희망 선택</title>
  <link rel="stylesheet" href="styles.css">

<body data-page="categories">
  <header class="site-header"><div class="container"><a href="profile.html" class="logo">← 프로필</a></div></header>
  <main class="container main">
    <section class="card">
      <h2>3. 미래 지도</h2>
      <p class="muted">대분류 / 중분류 / 소분류를 선택하세요. (희망 일자리/근무형태/활동유형)</p>
      <div class="selectors">
        <label>대분류 (희망일자리)
          <select id="selMajor"></select>
        </label>
        <label>중분류 (근무형태)
          <select id="selMid"></select>
        </label>
        <label>소분류 (활동유형)
          <select id="selMinor"></select>
        </label>
      </div>
      <div style="margin-top:12px">
        <button id="doRecommend" class="btn primary">다음: 요약 및 자기소개</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
