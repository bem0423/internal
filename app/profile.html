<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>마실 — 프로필 설정</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="profile">
  <header class="site-header"><div class="container"><a href="index.html" class="logo">← 마실</a></div></header>
  <main class="container main">
    <section class="card">
      <h2>경험 지도를 그려보세요.</h2>
      <p class="muted">1. 근무 지도 — 업종과 근속기간을 입력하여 경력을 추가하세요.</p>

      <div class="card" style="background:#fff9f0;border:1px solid #ffecd1;">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><strong>PASS 인증</strong><div class="muted">PASS 인증하면 과거 근무 이력이 자동으로 추가됩니다.</div></div>
          <div><button id="bannerAuth" class="btn">PASS 인증하기</button></div>
        </div>
      </div>

      <div style="margin-top:12px">
        <label>업종 선택
          <select id="industrySelect"></select>
        </label>
        <label>근속기간(년)
          <input id="tenureInput" type="number" min="0" placeholder="예: 5">
        </label>
        <div style="margin-top:8px"><button id="addWork" class="btn">추가</button></div>

        <ul id="workList" class="suggestions" style="margin-top:12px"></ul>
      </div>

      <hr>

      <h3>2. 현재 능력 — 스킬 선택</h3>
      <p class="muted">검색해 여러 개 선택할 수 있습니다. 선택한 항목은 칩으로 표시됩니다.</p>
      <div class="skill-picker">
        <input id="skillSearch" placeholder="스킬 검색 예: 생산관리, 멘토링" aria-label="스킬 검색">
        <ul id="skillSuggestions" class="suggestions"></ul>
        <div id="selectedSkills" class="chips"></div>
      </div>
      <div style="margin-top:12px">
        <button id="saveSkills" class="btn primary">다음: 능력 지도</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
