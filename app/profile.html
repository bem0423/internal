<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>마실 — 프로필 설정</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="profile">
  <header class="site-header"><div class="container"><a href="index.html" class="logo"><span class="brand">마실</span><small class="subtitle">생애경험 프로필 플랫폼</small></a></div></header>
  <main class="container main">
    <section class="card">
      <h2>경험 지도를 그려보세요.</h2>
      <p class="muted">1. 근무 지도 — 업종과 근속기간을 입력하여 경력을 추가하세요.</p>

      <div class="card" style="background:#fff9f0;border:1px solid #ffecd1;">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><strong>PASS 인증</strong><div class="muted">PASS 인증하면 과거 근무 이력이 자동으로 추가됩니다.</div></div>
          <div><button id="bannerAuth" class="btn">PASS 인증하기</button></div>
        </div>
      </div>

      <div style="margin-top:12px">
        <label>업종 선택
          <select id="industrySelect"></select>
        </label>
        <label>근속기간(년)
          <input id="tenureInput" type="number" min="0" placeholder="예: 5">
        </label>
        <div style="margin-top:8px"><button id="addWork" class="btn">추가</button></div>

        <ul id="workList" class="suggestions" style="margin-top:12px"></ul>
      </div>

      <hr>

      <div style="margin-top:12px">
        <button id="toAbilities" class="btn primary">다음: 능력 지도</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
  <nav class="bottom-nav" role="navigation" aria-label="하단 내비게이션">
    <a href="recommendations.html"><span class="icon">🏠</span><span>홈</span></a>
    <a href="community.html"><span class="icon">🫂</span><span>커뮤니티</span></a>
    <a href="neighborhood.html"><span class="icon">🗺️</span><span>동네지도</span></a>
    <a href="chat.html"><span class="icon">💬</span><span>채팅</span></a>
    <a href="mymap.html" class="active"><span class="icon">🧭</span><span>나의지도</span></a>
  </nav>
</body>
</html>
