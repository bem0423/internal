<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>동네지도 — 마실</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="neighborhood">
  <header class="site-header"><div class="container"><a href="index.html" class="logo"><span class="brand">마실</span><small class="subtitle">생애경험 프로필 플랫폼</small></a></div></header>
  <main class="container main">
    <h2>동네지도</h2>
    <p class="muted">동네에 올라온 일자리(예시) 위치를 표시한 지도입니다.</p>

    <section class="card" style="position:relative;overflow:hidden;height:360px" id="mapCard">
      <img src="assets/map_example2.svg" alt="map_example2" id="mapImage" style="width:100%;height:100%;object-fit:cover;border-radius:10px;opacity:0.98">
      <!-- 배너 하단 전체를 채우는 스트립으로 변경 (아이콘 높이 만큼) -->
      <div id="mapStrip" style="position:absolute;left:0;right:0;bottom:0;height:42px;background:rgba(255,255,255,0.95);display:flex;align-items:center;padding:0 12px;border-bottom-left-radius:10px;border-bottom-right-radius:10px;color:#333;font-size:13px">지도 이미지: map_example.svg</div>
      <div class="map-marker" data-title="부천 제조업" data-desc="제조업 보조 · 주 3일 가능" style="left:20%;top:32%"></div>
      <div class="map-marker" data-title="의료 봉사" data-desc="보건소 연계 주말 활동" style="left:60%;top:52%"></div>
      <div class="map-marker" data-title="지역 행사" data-desc="지역 문화행사 안내" style="left:40%;top:72%"></div>
      <div id="mapPopup" style="position:absolute;display:none;z-index:10;padding:8px;background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.12);max-width:220px"></div>
    </section>
  </main>
  <script src="script.js"></script>
  <nav class="bottom-nav" role="navigation" aria-label="하단 내비게이션">
    <a href="index.html"><span class="icon">🏠</span><span>홈</span></a>
    <a href="community.html"><span class="icon">🫂</span><span>커뮤니티</span></a>
    <a href="neighborhood.html" class="active"><span class="icon">🗺️</span><span>동네지도</span></a>
    <a href="chat.html"><span class="icon">💬</span><span>채팅</span></a>
    <a href="mymap.html"><span class="icon">🧭</span><span>나의지도</span></a>
  </nav>
</body>
</html>
