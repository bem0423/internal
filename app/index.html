<html lang="ko">
<head>

  <title>마실 — 로그인</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
  <main class="container main" style="padding-top:48px">
    <section id="loginCard" class="card" style="max-width:480px;margin:40px auto;text-align:center">
      <div style="display:flex;align-items:center;gap:12px;justify-content:center;flex-direction:column">
        <img src="assets/main_image.jpg" alt="마실" class="main-image">
        <div class="logo"><span class="brand">마실</span><small class="subtitle">생애경험 프로필 플랫폼</small></div>
      </div>
      <p class="lead">당신의 경험을 기록하고 연결하는 서비스</p>

      <div style="margin-top:20px">
        <button id="doLogin" class="btn primary" style="width:100%;padding:12px">로그인 (예제)</button>
      </div>

      <div style="margin-top:12px">
        <button id="doPension" class="btn" style="width:100%;padding:12px">국민연금 연동 (PASS 모의)</button>
      </div>

      <div style="margin-top:12px">
        <button id="fillDemo" class="btn ghost" style="width:100%;padding:12px">데모 프로필 채우기</button>
      </div>

      <p class="muted" style="margin-top:16px">로그인 또는 연동 후 프로필 설정 페이지로 이동합니다.</p>
    </section>
    <section id="homeRec" class="card" style="display:none;max-width:760px;margin:18px auto">
      <h2>추천 홈</h2>
      <div id="homeRecList" class="job-grid" style="display:none"></div>
    </section>
