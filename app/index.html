<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>마실 — 로그인</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
  <main class="container main" style="padding-top:48px">
    <section class="card" style="max-width:480px;margin:40px auto;text-align:center">
      <h1 class="logo">마실</h1>
      <p class="lead">생애경험 프로필 플랫폼 — 프로토타입 데모</p>

      <div style="margin-top:20px">
        <button id="doLogin" class="btn primary" style="width:100%;padding:12px">로그인 (예제)</button>
      </div>

      <div style="margin-top:12px">
        <button id="doPension" class="btn" style="width:100%;padding:12px">국민연금 연동 (PASS 모의)</button>
      </div>

      <p class="muted" style="margin-top:16px">로그인 또는 연동 후 프로필 설정 페이지로 이동합니다.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
