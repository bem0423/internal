<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>마실 — 로그인</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
  <main class="container main" style="padding-top:48px">
    <section class="card" style="max-width:720px;margin:18px auto;text-align:center">
      <img src="assets/main_image.jpg" alt="마실" class="main-image" style="max-width:540px;display:block;margin:8px auto">
      <div class="logo" style="margin-top:8px"><span class="brand">마실</span><small class="subtitle">생애경험 프로필 플랫폼</small></div>
      <p class="muted" style="margin-top:10px">마실에 오신 것을 환영합니다. 먼저 로그인하거나 국민연금 연동으로 프로필을 가져오세요.</p>
      <div style="margin-top:14px">
        <button id="doLogin" class="btn primary" style="width:100%;padding:12px">로그인</button>
      </div>
      <div style="margin-top:12px">
        <button id="doPension" class="btn" style="width:100%;padding:12px">국민연금 연동 (PASS)</button>
      </div>
      <div style="margin-top:12px">
        <button id="fillDemo" class="btn ghost" style="width:100%;padding:12px">데모 프로필 채우기</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
  </body>
</html>
