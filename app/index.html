  <link rel="stylesheet" href="styles.css">

<body data-page="login">
  <main class="container main" style="padding-top:48px">
    <section class="card" style="max-width:980px;margin:18px auto;text-align:center">
      <img src="assets/main_image.jpg" alt="마실" class="main-image" style="max-width:740px;display:block;margin:20px auto">

    <!-- login modal overlay -->
    <div id="loginModal" class="modal-backdrop">
      <div class="modal" style="max-width:480px;text-align:center">
        <h3>로그인 — 마실</h3>

        <div style="margin-top:12px">
          <button id="doLogin" class="btn primary" style="width:100%;padding:12px">로그인 (예제)</button>
        </div>
        <div style="margin-top:12px">
          <button id="doPension" class="btn" style="width:100%;padding:12px">국민연금 연동 (PASS 모의)</button>
        </div>
        <div style="margin-top:12px">
          <button id="fillDemo" class="btn ghost" style="width:100%;padding:12px">데모 프로필 채우기</button>
        </div>
      </div>
    </div>
    <section id="homeRec" class="card" style="display:none;max-width:760px;margin:18px auto">
      <h2>추천 홈</h2>
      <div id="homeRecList" class="job-grid" style="display:none"></div>
