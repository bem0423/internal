<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>마실 — 능력 지도</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="abilities">
  <header class="site-header"><div class="container"><a href="profile.html" class="logo">← 경험 지도</a></div></header>
  <main class="container main">
    <section class="card">
      <h2>2. 능력 지도</h2>
      <p class="muted">교육, 자격증, 전문분야, 디지털 활용 등 항목을 탭에서 선택해 추가하세요.</p>

      <div class="tabs" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="tab-btn" data-tab="education">교육·학습</button>
        <button class="tab-btn" data-tab="certs">자격증</button>
        <button class="tab-btn" data-tab="expertise">전문분야</button>
        <button class="tab-btn" data-tab="digital">디지털 활용</button>
      </div>

      <div style="margin-top:12px">
        <input id="abilityInput" placeholder="항목을 입력하고 추가하세요">
        <button id="addAbility" class="btn">추가</button>
      </div>

      <div style="margin-top:12px">
        <h4>추가된 항목</h4>
        <div id="abilityLists"></div>
      </div>

      <div style="margin-top:12px">
        <button id="saveAbilities" class="btn primary">다음: 미래 지도</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
